# Release the Go command line, achart: push a tag go/vX.Y.Z (the Go module lives in go/, so its version tags
# carry that prefix; it must equal asciicharts.Version). Tests, then one static binary per OS and
# architecture, each in its own zip (achart-<os>-<arch>.zip, the version and SHA256 in the zip comment),
# then a GitHub release with SHA256SUMS.txt. The MCP server is not released: build it with go install.
name: release-go

on:
  push:
    tags: ["go/v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Test
        working-directory: go
        run: go test -race -count=1 ./...

      - name: Check the tag against asciicharts.Version
        working-directory: go
        run: test "$(go run ./cmd/achart --version)" = "${GITHUB_REF_NAME#go/v}"

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
          - { goos: darwin, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build and package
        working-directory: go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#go/v}"
          BIN="achart${{ matrix.ext }}"
          ZIP="achart-${{ matrix.goos }}-${{ matrix.goarch }}.zip"

          go build -trimpath -ldflags "-s -w" -o "$BIN" ./cmd/achart
          SHA256="$(sha256sum "$BIN" | awk '{print $1}')"

          # zipped on Linux, so the executable bit survives for macOS and Linux
          cp ../LICENSE LICENSE.txt
          zip -9 "../$ZIP" "$BIN" LICENSE.txt
          printf '%s\n' \
            'achart - text charts from numbers (asciicharts)' \
            "Version: ${VERSION}" \
            'https://asciicharts.online' \
            "SHA256 of ${BIN}: ${SHA256}" | zip -z "../$ZIP"
          rm -f "$BIN" LICENSE.txt

      - uses: actions/upload-artifact@v4
        with:
          name: achart-${{ matrix.goos }}-${{ matrix.goarch }}
          path: achart-${{ matrix.goos }}-${{ matrix.goarch }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum achart-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#go/}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: achart ${{ steps.v.outputs.version }}
          body: |
            `achart`, the asciicharts command line: one static binary, no dependencies. Unzip it, put it on your PATH, try `achart --list`.

            **macOS:** the binary is not notarized, so a copy downloaded in a browser is blocked by Gatekeeper ("cannot be opened" / "damaged"). Download it with `curl -LO` instead, or clear the flag once: `xattr -d com.apple.quarantine achart`.

            Or build it: `go install github.com/boligolov/asciicharts/go/cmd/achart@${{ steps.v.outputs.version }}`. The MCP server is not in the release: `go install github.com/boligolov/asciicharts/go/cmd/asciicharts-mcp@${{ steps.v.outputs.version }}`.
          files: |
            dist/achart-*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
