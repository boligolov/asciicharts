# Release the Go command line: push a tag go/vX.Y.Z (the Go module lives in go/, so its version tags
# carry that prefix) and this builds static binaries for linux/macOS/windows on amd64/arm64, and
# publishes them with checksums as a GitHub release.
name: release-go

on:
  push:
    tags: ["go/v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - name: Test
        working-directory: go
        run: go test ./...
      - name: Check the tag against asciicharts.Version
        working-directory: go
        run: test "$(go run ./cmd/asciicharts --version)" = "${GITHUB_REF_NAME#go/v}"
      - name: Build
        working-directory: go
        run: |
          version="${GITHUB_REF_NAME#go/v}"
          mkdir -p ../dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="asciicharts_${version}_${os}_${arch}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w" -o "build/$name/asciicharts$ext" ./cmd/asciicharts
            cp README.md ../LICENSE "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../../dist/$name.zip" "$name")
            else
              tar -C build -czf "../dist/$name.tar.gz" "$name"
            fi
          done
          cd ../dist && sha256sum * > checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "asciicharts ${GITHUB_REF_NAME#go/} (Go command line)" \
            --notes "Static binaries of the asciicharts command line. Unpack, put \`asciicharts\` on your PATH, run \`asciicharts --list\`. Or: \`go install github.com/boligolov/asciicharts/go/cmd/asciicharts@${GITHUB_REF_NAME#go/}\`."
