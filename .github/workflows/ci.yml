# Both implementations and the project-wide checks, on every push to master and every pull request.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Test
        working-directory: go
        run: go test -race -count=1 ./...

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e "./python[dev]"

      - name: Test
        run: pytest python/tests test

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Go against Python
        run: |
          python test/parity/differential.py 3000
          python test/parity/differential_csv.py 1000
          python test/parity/cli_parity.py
