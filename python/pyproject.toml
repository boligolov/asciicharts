[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "asciicharts"
version = "1.0.0"
description = "Charts made of text characters, done right: the Python reference implementation of the asciicharts principles, in one standard-library file."
keywords = ["ascii", "unicode", "text", "chart", "plot", "terminal", "cli", "sparkline", "bar chart", "csv", "excsv", "agents"]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Homepage = "https://github.com/boligolov/asciicharts"
Principles = "https://github.com/boligolov/asciicharts/blob/master/spec/principles.md"
Gallery = "https://github.com/boligolov/asciicharts/blob/master/docs/gallery.md"
Issues = "https://github.com/boligolov/asciicharts/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

# asciicharts.py is a stdlib-only single file (also shipped inside the skill).
[tool.setuptools]
py-modules = ["asciicharts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
