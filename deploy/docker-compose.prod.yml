# Production stack: Caddy (automatic HTTPS for your domain) -> the MCP server.
# Usage statistics (and the Postgres they need) are OFF by default; see below to enable them.
#
# Run from the repository root:
#   cp deploy/.env.example deploy/.env      # then set DOMAIN
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# To also record anonymous usage statistics, set these in deploy/.env and rerun:
#   ASCIICHARTS_STATS=on
#   COMPOSE_PROFILES=stats            # starts the db service below
#   POSTGRES_PASSWORD=<strong secret>
#
# Only Caddy publishes ports (80/443). The MCP server and Postgres are reachable
# only on the internal compose network — unlike docker-compose.yml, which is for
# local development and publishes Postgres on :5432 with a default password.
#
# Point your domain's DNS A/AAAA record at this host first: Caddy obtains and
# renews the Let's Encrypt certificate on its own, and needs ports 80 and 443
# reachable from the internet to do it.

name: asciicharts-prod

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env (the public host name, e.g. charts.example.com)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # certificates: keep this volume, or you'll re-issue on every deploy
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

  web:
    # Build here, or set IMAGE to a prebuilt tag from your registry (then drop `build`).
    image: ${IMAGE:-asciicharts:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        required: false # the db only exists when the `stats` profile is on
    environment:
      PORT: "8080"
      # Statistics are opt-in: without ASCIICHARTS_STATS=on the server never touches the database.
      ASCIICHARTS_STATS: ${ASCIICHARTS_STATS:-off}
      # POSTGRES_PASSWORD is inserted verbatim into a URL: if it contains
      # characters like @ : / ? # % , percent-encode them (or use a plain
      # alphanumeric password, e.g. `openssl rand -hex 24`).
      DATABASE_URL: postgres://${POSTGRES_USER:-asciicharts}:${POSTGRES_PASSWORD:-}@db:5432/${POSTGRES_DB:-asciicharts}?sslmode=disable
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "asciicharts-mcp", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Only started with COMPOSE_PROFILES=stats (see the top of this file).
  db:
    profiles: ["stats"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asciicharts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-} # required by Postgres: set it when enabling stats
      POSTGRES_DB: ${POSTGRES_DB:-asciicharts}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asciicharts} -d ${POSTGRES_DB:-asciicharts}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caddy-data:
  caddy-config:
  db-data:
