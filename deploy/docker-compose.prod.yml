# Production stack: Caddy (automatic HTTPS for your domain) -> the MCP server.
#
# Run from the repository root:
#   cp deploy/.env.example deploy/.env      # then set DOMAIN
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# Only Caddy publishes ports (80/443); the MCP server is reachable only on the internal compose network.
#
# Point your domain's DNS A/AAAA record at this host first: Caddy obtains and renews the Let's Encrypt
# certificate on its own, and needs ports 80 and 443 reachable from the internet to do it.

name: asciicharts-prod

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env (the public host name, e.g. charts.example.com)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # certificates: keep this volume, or you'll re-issue on every deploy
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

  web:
    # Build here, or set IMAGE to a prebuilt tag from your registry (then drop `build`).
    image: ${IMAGE:-asciicharts:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
    expose:
      - "8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/asciicharts-mcp", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  caddy-data:
  caddy-config:
