# Local run of the HTTP server, published on :8080 (MCP at /mcp, health at /healthz).
# For production (HTTPS through Caddy) see docker-compose.prod.yml.
#
#   docker compose -f deploy/docker-compose.yml up -d --build      (from the repo root)

name: asciicharts

services:
  # PORT switches the server from its default stdio mode to a long-running HTTP server exposing the
  # streamable-HTTP MCP transport at /mcp, plus a plain /healthz.
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
    ports:
      - "8080:8080"
    healthcheck:
      # The image has nothing but the server, which checks itself ("healthcheck" subcommand).
      test: ["CMD", "/asciicharts-mcp", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
